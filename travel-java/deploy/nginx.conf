# ================================================================
# Nginx 反向代理 + 负载均衡 示例配置
#
# 用法：
#  1. 前端构建产物放到 /usr/share/nginx/html（trval-h5 的 dist）
#  2. 后端多实例：docker compose up -d --scale app=2
#  3. 应用端设置 RATE_LIMIT_TRUST_PROXY=true（信任本代理注入的 X-Real-IP）
# ================================================================

# 上游应用集群（容器网络内服务名 + 端口；扩容 app 实例数即可水平扩展）
upstream travel_app {
    least_conn;                      # 最少连接负载均衡
    server app:3200 weight=1;
    # server app_2:3200 weight=1;    # 扩容后自动加入，多个实例共享 MySQL/Redis/MQ
    keepalive 32;
}

# 上游 Agent 微服务（Python，单实例；SSE 由后端透传，一般不需直连）
upstream travel_agent {
    server agent-service:3201;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    # ---- 前端静态资源（H5 构建产物）----
    root /usr/share/nginx/html;
    index index.html;

    # 单页应用路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 后端 API 转发（含 SSE 流式，必须关缓冲 + 加长读超时）----
    location /api/ {
        proxy_pass http://travel_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：禁用缓冲，否则流式进度会被攒成整块返回
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ---- Agent 微服务直连（可选用；当前后端 AgentProxyController 已透传）----
    location /api/agent/ {
        proxy_pass http://travel_agent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # ---- 健康检查透传 ----
    location = /actuator/health {
        proxy_pass http://travel_app;
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1k;
}
