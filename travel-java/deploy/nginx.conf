# ================================================================
# Nginx 反向代理 + 负载均衡 示例配置
#
# 用法：
#  1. 前端构建产物放到 /usr/share/nginx/html（trval-h5 的 dist）
#  2. 后端多实例：docker compose up -d --scale app=2
#  3. 应用端设置 RATE_LIMIT_TRUST_PROXY=true（信任本代理注入的 X-Real-IP）
# ================================================================

# 上游应用集群（容器网络内服务名 + 端口；扩容 app 实例数即可水平扩展）
upstream travel_app {
    least_conn;                      # 最少连接负载均衡
    server app:3200 weight=1;
    # server app_2:3200 weight=1;    # 扩容后自动加入，多个实例共享 MySQL/Redis/MQ
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ---- 安全响应头（全站；子 location 若自带 add_header 需自行重复，见下）----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 上传/请求体上限：后端允许 50MB 视频，nginx 默认 1MB 会提前 413（与后端对齐并留余量）
    client_max_body_size 60m;

    # ---- 前端静态资源（H5 构建产物）----
    root /usr/share/nginx/html;
    index index.html;

    # 单页应用路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 缓存策略（修复部署后“点击路由没反应”）----
    # index.html 必须每次校验新鲜度：否则浏览器启发式缓存旧版 html，
    # 引用已删除的旧 hash chunk -> 异步路由 404 -> 路由跳转静默失败
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    # sw.js 同理：SW 更新检查必须拿到最新字节
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    # vite 构建产物带内容 hash，可永久缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ---- 用户上传文件（图片/视频）----
    # 宿主机 ./uploads 挂载进 nginx 的 /opt/uploads（不能挂到 /usr/share/nginx/html 下——
    # 该目录是只读 bind mount，无法在其下创建挂载点），用 alias 映射 /uploads/。
    # 避免 /uploads/** 落入上方 SPA 回退返回 index.html 导致图片破图。
    location /uploads/ {
        alias /opt/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        access_log off;
    }

    # ---- 后端 API 转发（含 SSE 流式，必须关缓冲 + 加长读超时）----
    location /api/ {
        proxy_pass http://travel_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：禁用缓冲，否则流式进度会被攒成整块返回
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 安全：/api/agent 不再直连 Python，统一经 /api/ → Spring Boot（JWT 鉴权 + 共享密钥透传）

    # ---- 健康检查透传 ----
    # 注意两点（否则 Tomcat 回 400）：
    #  1. keepalive upstream 必须 HTTP/1.1（proxy_http_version 1.1）
    #  2. 必须显式设置 Host $host——默认 $proxy_host 是上游块名 travel_app，
    #     带下划线，Tomcat 的 Host 校验会直接拒绝并返回 400
    location = /actuator/health {
        proxy_pass http://travel_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1k;
}
