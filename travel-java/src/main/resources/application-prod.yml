# ================================================================
# 生产 profile — 通常与数据库 profile 联合使用：
#   --spring.profiles.active=mysql,prod   （MySQL + 生产）
#   --spring.profiles.active=postgres,prod（PostgreSQL + 生产）
# 生产默认 MySQL 主机 mysql（docker-compose 内服务名），可用环境变量覆盖。
# ================================================================
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:travel_plans}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: 30000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # 生产环境开启消费者（确保 MQ 已就绪，或 RABBITMQ 不可用时不致命）
        auto-startup: ${MQ_LISTENER_AUTO_STARTUP:true}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,env
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}
