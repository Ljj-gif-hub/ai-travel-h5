# ================================================================
# MySQL 数据源 profile
# 启用方式：
#   java -jar travel-java.jar --spring.profiles.active=mysql
# 或环境变量：SPRING_PROFILES_ACTIVE=mysql
#
# 说明：保持默认不传 profile 时为 H2（零配置开箱即用）；
#       传 mysql 即切换到 MySQL，全部连接参数可用环境变量覆盖。
# ================================================================
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:travel_plans}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_TIMEOUT:30000}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
