server:
  port: ${SERVER_PORT:3200}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    max-http-form-post-size: 2GB

spring:
  application:
    name: travel-java
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 2GB
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/travel_plans;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:6000ms}
      repositories:
        enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # 默认不自动启动消费者，避免本地无 RabbitMQ 时启动报错；连上后再手动开启
        auto-startup: ${MQ_LISTENER_AUTO_STARTUP:false}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5177}
  # 日志输出目录（配合 logback-spring.xml）
  logging:
    dir: ${LOG_DIR:logs}
  # 消息队列：默认关闭（无 RabbitMQ 也可运行，事件同步降级记录）
  mq:
    enabled: ${MQ_ENABLED:false}
    exchange: ${MQ_EXCHANGE:travel.events}
    queue-orders: ${MQ_QUEUE_ORDERS:travel.orders}
    routing-orders: ${MQ_ROUTING_ORDERS:order.paid}
  # 限流是否信任反向代理注入的 X-Real-IP（仅当部署在受信代理后时置 true）
  rate-limit:
    trust-proxy: ${RATE_LIMIT_TRUST_PROXY:false}
  # 管理员账号（启动时自动创建，建议通过环境变量注入并修改默认密码）
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}

# ================================================================
# AI 多供应商配置（支持所�?OpenAI 兼容协议�?API�?
# 切换供应商：修改 ai.active-provider 的值即�?
# 添加新供应商：在 ai.providers 下新增一组配�?
# ================================================================
ai:
  # 设为 auto 或不�?�?启动时自动扫描已配置�?API Key 来激活对应供应商
  # 显式指定�?deepseek/openai/claude �?强制使用该供应商
  active-provider: ${AI_PROVIDER:auto}
  # ---- AI 图片生成（独立于LLM供应商） ----
  image:
    endpoint: ${AI_IMAGE_ENDPOINT:https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image}
    api-key: ${AI_IMAGE_API_KEY:}
    timeout: ${AI_IMAGE_TIMEOUT:30000}
  providers:
    # ---- DeepSeek ----
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      max-tokens: 4096
      temperature: 0.7
    # ---- OpenAI ----
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com/v1
      model: ${OPENAI_MODEL:gpt-4o}
      max-tokens: 4096
      temperature: 0.7
    # ---- Claude (Anthropic) ----
    claude:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: https://api.anthropic.com
      model: ${CLAUDE_MODEL:claude-sonnet-4-20250514}
      max-tokens: 4096
      temperature: 0.7
      extra-headers:
        Authorization-Header: x-api-key
        anthropic-version: "2023-06-01"
    # ---- Google Gemini ----
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: https://generativelanguage.googleapis.com/v1beta
      model: ${GEMINI_MODEL:gemini-2.0-flash}
      chat-path: /models/${GEMINI_MODEL:gemini-2.0-flash}:generateContent
      max-tokens: 4096
      temperature: 0.7
    # ---- 自定�?代理 API（任何兼�?OpenAI 协议的接口） ----
    custom:
      api-key: ${CUSTOM_AI_KEY:}
      base-url: ${CUSTOM_AI_URL:https://apihub.agnes-ai.com/v1}
      model: ${CUSTOM_AI_MODEL:agnes-2.0-flash}
      max-tokens: 4096
      temperature: 0.7

jwt:
  # JWT 签名密钥（必填，>=32 字符）。未设置时应用启动即失败（fail-closed）。
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

# ================================================================
# 地图多供应商配置（百度地�?+ 高德地图 双API接入�?
# 切换供应商：修改 map.provider 的值即�?
#   baidu - 百度地图（默认）
#   amap  - 高德地图
#   auto  - 自动检测已配置�?Key 来激�?
# ================================================================
map:
  provider: ${MAP_PROVIDER:amap}
  baidu:
    ak: ${BAIDU_MAP_AK:}
  amap:
    web-key: ${AMAP_WEB_KEY:}                                          # 高德 Web 服务 API Key（通过环境变量注入，未设置则地图不可用）
    js-key: ${AMAP_JS_KEY:}        # 高德 JS API v2.0 Key（前端加载地图用，为空则回退到 web-key）

# ================================================================
# 第三方支付对接层（可配置 + 模拟实现）
#   provider: mock | alipay | wechat
#   未配置真实商户密钥时默认走 mock（模拟支付），填 Key 后改 provider 即切换真实渠道
# ================================================================
payment:
  provider: ${PAYMENT_PROVIDER:mock}
  mock:
    secret: ${PAYMENT_MOCK_SECRET:dev-mock-secret}
  alipay:
    app-id: ${ALIPAY_APP_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    public-key: ${ALIPAY_PUBLIC_KEY:}
    notify-url: ${ALIPAY_NOTIFY_URL:}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    mch-id: ${WECHAT_MCH_ID:}
    api-key: ${WECHAT_API_KEY:}
    notify-url: ${WECHAT_NOTIFY_URL:}

# 酒店预订配置
hotel:
  mock-full: ${HOTEL_MOCK_FULL:false}

# ================================================================
# 第三方预订对接层（与支付层同款「可配置 + 模拟实现」）
#   provider: mock（默认，本地/内置数据） | real（第三方渠道，需配 endpoint + api-key）
# ================================================================
booking:
  hotel:
    provider: ${BOOKING_HOTEL_PROVIDER:mock}
    endpoint: ${BOOKING_HOTEL_ENDPOINT:}
    api-key: ${BOOKING_HOTEL_API_KEY:}
  flight:
    provider: ${BOOKING_FLIGHT_PROVIDER:mock}
    endpoint: ${BOOKING_FLIGHT_ENDPOINT:}
    api-key: ${BOOKING_FLIGHT_API_KEY:}

# ================================================================
# Swagger/OpenAPI 接口文档（springdoc）
#   UI:   http://localhost:3200/swagger-ui.html
#   JSON: http://localhost:3200/v3/api-docs
# ================================================================
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
  show-actuator: true
  paths-to-exclude: /api/agent/**

# ================================================================
# 日志（配合 logback-spring.xml；级别可经环境变量覆盖）
# ================================================================
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.example.traveljava: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}

# ================================================================
# Actuator 监控指标
#   Prometheus 抓取: GET /actuator/prometheus
#   健康检查:        GET /actuator/health
# ================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:when-authorized}
    loggers:
      enabled: true
    prometheus:
      enabled: true
  health:
    # Redis / RabbitMQ 均为可降级组件（应用内优雅降级），未部署时不应判定服务不可用
    redis:
      enabled: false
    rabbit:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
