# ================================================================
# 生产部署编排：MySQL + Redis + RabbitMQ + 应用 + Agent 微服务（可横向扩容）
#
# 用法：
#   docker compose up -d --build              # 构建并启动
#   docker compose up -d --build --scale app=2   # 2 个应用实例（配合 nginx 负载均衡）
#
# 环境变量可在 .env 中覆盖，最小必填：JWT_SECRET（应用启动强制校验）、
# AGENT_API_KEY（后端↔Agent 共享密钥，两端必须一致）
# ================================================================
services:
  mysql:
    image: mysql:8.0
    container_name: travel-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-travel_plans}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-travel_root_2026}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-travel_root_2026}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: travel-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: travel-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"      # AMQP
      - "127.0.0.1:15672:15672"    # 管理台 http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10

  agent-service:
    build: ../agent-service
    image: travel-agent:latest
    restart: unless-stopped
    environment:
      AGENT_PORT: 3201
      # 与后端共享的密钥（透传鉴权）+ JWT 密钥（用于校验 user_id 绑定）
      AGENT_API_KEY: ${AGENT_API_KEY:?请设置 AGENT_API_KEY（与后端一致）}
      AGENT_JWT_SECRET: ${JWT_SECRET:-}
      # Agent 自身 LLM / 搜索 / 地图 Key
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}
      # MCP（可选）
      MCP_SERVER_ENABLED: ${MCP_SERVER_ENABLED:-false}
    ports:
      # 仅内网可达，公网统一走 nginx:80（agent 已被鉴权中间件保护）
      - "127.0.0.1:3201:3201"

  app:
    build: .
    image: travel-java:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      agent-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: mysql,prod
      JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET（>=32字符）}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-travel_plans}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-travel_root_2026}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      MQ_ENABLED: ${MQ_ENABLED:-true}
      MQ_LISTENER_AUTO_STARTUP: "true"
      # Agent 微服务地址 + 共享密钥（与 agent-service 一致）
      AGENT_SERVICE_URL: http://agent-service:3201
      AGENT_API_KEY: ${AGENT_API_KEY:?请设置 AGENT_API_KEY（与 agent-service 一致）}
      # 管理员初始密码（必填，防止默认口令 admin123 被创建）
      APP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请设置 ADMIN_PASSWORD}
      # AI 供应商 Key（可选，配置后可用真实 LLM）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 地图 Key（可选）
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}
      BAIDU_MAP_AK: ${BAIDU_MAP_AK:-}
    ports:
      # 仅内网可达，公网统一走 nginx:80（接口本身有 JWT 鉴权）
      - "127.0.0.1:3200:3200"

  # Nginx 反向代理 + 前端静态资源（dist 挂载进容器，80 端口对外）
  nginx:
    image: nginx:alpine
    container_name: travel-nginx
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ../trval-h5/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
