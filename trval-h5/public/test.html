<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API 测试</title></head>
<body><h2>API 测试</h2>
<button onclick="test()">测试注册 POST</button>
<pre id="out" style="background:#f5f5f5;padding:10px;white-space:pre-wrap"></pre>
<script>
async function test() {
  const out = document.getElementById('out')
  out.textContent = '发送中...'
  try {
    const r = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: 'phonetest' + Date.now(), password: '123456', confirmPassword: '123456' })
    })
    const text = await r.text()
    out.textContent = '状态: ' + r.status + '\n响应: ' + text
  } catch(e) {
    out.textContent = '错误: ' + e.message
  }
}
</script></body></html>
